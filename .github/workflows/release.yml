name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/giss dist/
          cp target/${{ matrix.target }}/release/gism dist/
          cp target/${{ matrix.target }}/release/gistui dist/
          tar -czf giss-${{ matrix.target }}.tar.gz -C dist .

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\giss.exe dist\
          copy target\${{ matrix.target }}\release\gism.exe dist\
          copy target\${{ matrix.target }}\release\gistui.exe dist\
          7z a giss-${{ matrix.target }}.zip ./dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: giss-${{ matrix.target }}
          path: giss-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            giss-x86_64-unknown-linux-gnu/giss-x86_64-unknown-linux-gnu.tar.gz
            giss-aarch64-unknown-linux-gnu/giss-aarch64-unknown-linux-gnu.tar.gz
            giss-x86_64-apple-darwin/giss-x86_64-apple-darwin.tar.gz
            giss-aarch64-apple-darwin/giss-aarch64-apple-darwin.tar.gz
            giss-x86_64-pc-windows-msvc/giss-x86_64-pc-windows-msvc.zip
